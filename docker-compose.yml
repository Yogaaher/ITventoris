services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itventoris_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    ports:
      - "5173:5173"
    networks:
      - itventoris_net
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: itventoris_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - itventoris_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: itventoris_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-itventoris}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${DB_USERNAME:-itventoris_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - itventoris_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: itventoris_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 50M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - itventoris_net
    depends_on:
      - db

networks:
  itventoris_net:
    driver: bridge

volumes:
  dbdata:
    driver: local
